# Infraestrutura LOCAL (desenvolvimento) do Sistema Clínica.
# Produção: use docker-compose.prod.yml (sem portas expostas, segredos obrigatórios) — ver docs/DEPLOY.md.
# As portas são publicadas SÓ em 127.0.0.1 (não ficam acessíveis pela rede local/internet).
# Volumes NOMEADOS (não bind mount): o diretório do projeto fica num disco de rede (SMB),
# o que deixa o Postgres lento/instável se os dados ficarem nele.
# As variáveis ${...} vêm do arquivo .env da raiz (lido automaticamente pelo docker compose).
name: sistema-clinica

services:
  postgres:
    image: postgres:16-alpine
    container_name: clinica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica}
      POSTGRES_DB: ${POSTGRES_DB:-clinica}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinica} -d ${POSTGRES_DB:-clinica}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: clinica-redis
    restart: unless-stopped
    # Com senha (REDIS_PASSWORD do .env; a REDIS_URL da API usa redis://:SENHA@localhost:6379).
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dados:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Mailpit (só DEV): "caixa de e-mail" falsa que pega TODOS os e-mails enviados pelo sistema — nada sai para a
  # internet. Interface em http://localhost:8025. No painel do super admin (/admin/email) configure:
  # host 127.0.0.1 (ou localhost), porta 1025, TLS implícito DESLIGADO, usuário/senha qualquer (ex.: dev/dev).
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: clinica-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # WPPConnect Server (não oficial). Uma sessão por clínica.
  # A API se comunica com ele SOMENTE via src/servicos/whatsapp/whatsappService.ts.
  # O webhook chama a API rodando no host (fora do Docker) — por isso host.docker.internal.
  wppconnect:
    image: wppconnect/server-cli:latest
    container_name: clinica-wppconnect
    restart: unless-stopped
    command:
      - --secretKey
      - ${WPPCONNECT_SECRET_KEY:-troque-esta-chave}
      - --port
      - "21465"
      - --startAllSession
      - --webhook-url
      - http://host.docker.internal:3333/webhooks/whatsapp?token=${WEBHOOK_TOKEN:-troque-este-token}
      - --no-webhook-onPresenceChanged
      - --no-webhook-onParticipantsChanged
      - --log-level
      - info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:21465:21465"
    volumes:
      - wpp_tokens:/usr/src/wpp-server/tokens
      - wpp_userdata:/usr/src/wpp-server/userDataDir

volumes:
  postgres_dados:
  redis_dados:
  wpp_tokens:
  wpp_userdata:
